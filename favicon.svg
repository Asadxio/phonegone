<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="emGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#043629"/>
      <stop offset="100%" stop-color="#095a48"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d485"/>
      <stop offset="100%" stop-color="#cda34f"/>
    </linearGradient>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="64" height="64" rx="14" fill="url(#emGrad)"/>
  <!-- Subtle Inner Border -->
  <rect x="2" y="2" width="60" height="60" rx="12" fill="none" stroke="#ffffff1a" stroke-width="1.5"/>
  <!-- Phone Body -->
  <rect x="21" y="13" width="22" height="38" rx="4" fill="#ffffff" stroke="url(#goldGrad)" stroke-width="2"/>
  <!-- Screen Area -->
  <rect x="24" y="19" width="16" height="24" rx="2" fill="#043629"/>
  <!-- Phone Speaker -->
  <line x1="28" y1="16" x2="36" y2="16" stroke="#cda34f" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Phone Home Dot / Bar -->
  <circle cx="32" cy="46.5" r="1.5" fill="#cda34f"/>
  <!-- Rescue Shield / Pulse icon inside screen -->
  <path d="M32 23 L37 25.5 V29 C37 32 35 34.5 32 35.5 C29 34.5 27 32 27 29 V25.5 Z" fill="url(#goldGrad)"/>
  <circle cx="32" cy="28.5" r="1.2" fill="#043629"/>
</svg>
